# The release pipeline: this repository reacts to its OWN release TAG and publishes the version-tagged
# image. That is not a loop — `SCMPublishTag` says only "this repository now has this tag", and the
# git host says it; nothing here pushes one. qits-ci turns a green run into one `SoftwareRelease` per
# entry under `artifacts:` when an `SCMRelease` for the version arrived too, and nothing here listens
# for either.
#
# THE TAG IS THE TRIGGER SO THAT A RESTORE NEEDS NOTHING ELSE. The tag is the durable release stamp —
# it outlives the event log and every image store — so a bootstrap replay re-establishes this release
# by pushing the tag alone and letting this pipeline rebuild the image. A real release pushes the tag
# and publishes `SCMRelease` beside it; the extra event buys the announcement, not the image
# (bootstrap-replay-plan.md in the wrapper).
#
# The repository has no version file. A qits release creates the version and the annotated tag, and
# the tag name IS that version.
event: SCMPublishTag
when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match on repoId never fires. The tag event echoes the public name the push
  # was addressed with; a rename updates this line in the same campaign.
  - repoName: { exact: qits-workspace-oci }

# A DECLARATION, NOT A REPORT. qits-ci cannot see what the step pushed; it announces on the strength
# of this line. Keep it true.
#
# The name is `qits/workspace-base`, not the repository name: that is what the consuming Dockerfiles
# already write (qits-workspace-daemon's docker/Dockerfile.workspace layers the daemon onto it), and
# a rename would break them for nothing.
artifacts:
  - { type: docker, name: qits/workspace-base }

# NO deployments.yml in this repository, and that is correct. This image is consumed by a service —
# it is a base another Dockerfile builds on — so nothing ever runs it as a container. That is the
# same case as images/qits-oci, which has none. images/qits-oci-postgresql has one because a
# database genuinely runs as a deployed container; this does not.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 7200
    script: |
      # The daemon runs this with `bash -c` and no -e. Without -e a failed docker build is swallowed
      # and a green release run makes qits-ci announce an artifact that was never pushed. -u makes an
      # unset registry variable stop the step.
      set -eu

      # The payload reaches the container verbatim as one string in $QITS_EVENT_PAYLOAD — there is
      # no per-field projection. ci-base carries jq; the case guard refuses a malformed or absent
      # value before any registry tag is created, since a CalVer is only digits and dots. It matters
      # more than it did: the tag name IS the version now, and no release flow vetted it — any tag
      # pushed to this repository arrives here.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -r '.tagName')
      case "$version" in
        ''|null|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # a later push moves; the tag does not. The clone is shallow and carries no tags, hence the
      # explicit refspec, and the URL rather than `origin` because every address arrives as
      # environment. `checkout --detach` peels the annotated tag to its commit.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # ONE TAG PER PIPELINE. Push only `:$version` here — never also `:latest` or the sha. A
      # sibling repository tried `docker build -t A -t B` then pushed both, and the second push
      # failed with "tag does not exist": BuildKit's exporter does not reliably leave every alias of
      # a multi-tag build in the local image store. ci-post-receive.yml owns the sha coordinate;
      # this pipeline owns the version coordinate.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-base:$version"
      docker build -t "$ref" -f Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving, which is the
      # race that broke the release of 2026-08-11.

      # --- the SBOM -------------------------------------------------------------------------------
      # THE SBOM FOR AN IMAGE LIKE THIS ONE IS ITS `FROM` LINE, and there is nothing else it
      # honestly could be: this Dockerfile assembles its toolchain with `apt` and a handful of
      # tarballs, and declares no manifest a scanner could read. What a consumer of it needs to
      # know is which upstream it inherits and at which tag, and that is exactly one `FROM` per
      # stage. The same shape qits-build-images-oci publishes for the five step images, with its
      # loop collapsed — there is one image here.
      #
      # AFTER THE PUSH AND BEFORE GREEN, which is the ordering rule rather than a preference:
      # qits-ci announces `SoftwareRelease` only for a green run, so a document stored here can
      # never be missing for a version somebody was told about. A failed PUT fails the release on
      # purpose.
      #
      # A multi-stage file names its OWN earlier stages in later `FROM`s, and a stage alias is not
      # an upstream image. This file has one stage today and the skip below therefore removes
      # nothing; it is here so the document stays right the day it grows a builder stage.
      stages=$(sed -n \
        's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]].*[[:space:]][Aa][Ss][[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*$/\1/p' \
        Dockerfile)
      # Every `FROM`'s image ref: drop the keyword, drop any `--platform=`-style flag, keep the
      # first word — which leaves the ref alone and discards a trailing `AS <stage>`.
      bases=$(sed -n 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]\{1,\}//p' Dockerfile \
        | sed 's/--[^[:space:]]*[[:space:]]\{1,\}//g' \
        | sed 's/[[:space:]].*$//')

      components=''
      depends=''
      seen=''
      sep=''
      for base in $bases; do
        for stage in $stages; do
          if [ "$base" = "$stage" ]; then base=''; break; fi
        done
        [ -n "$base" ] || continue
        # The ref reaches a JSON document and a purl, so its shape is checked the same way the
        # version was: a reference is the registry's own charset and nothing else. Nothing but this
        # Dockerfile feeds this, and that is precisely why the guard is cheap to keep.
        case "$base" in
          ''|*[!a-zA-Z0-9._:/@-]*)
            echo "Dockerfile: unusable FROM '$base'" >&2; exit 1 ;;
        esac
        # DISTINCT BASES ONLY — two stages built from one upstream are one dependency.
        case " $seen " in
          *" $base "*) continue ;;
        esac
        seen="$seen $base"

        case "$base" in
          # A digest ref pins harder than a tag, so the digest IS the version.
          *@*)
            name=${base%@*}
            tag=${base##*@}
            ;;
          *)
            # An untagged `FROM` means `latest` by definition. The colon is not proof of a tag: a
            # registry host may carry a port, and in `host:5000/image` the colon is the port's.
            tag=${base##*:}
            case "$base" in
              *:*) : ;;
              *) tag='' ;;
            esac
            case "$tag" in
              */*) tag='' ;;
            esac
            if [ -n "$tag" ]; then
              name=${base%:*}
            else
              name=$base
              tag=latest
            fi
            ;;
        esac

        purl="pkg:docker/$name@$tag"
        components="$components$sep$(printf \
          '{"type":"container","bom-ref":"%s","name":"%s","version":"%s","purl":"%s"}' \
          "$purl" "$name" "$tag" "$purl")"
        depends="$depends$sep$(printf '"%s"' "$purl")"
        sep=','
      done
      if [ -z "$components" ]; then
        echo "Dockerfile declares no base image" >&2; exit 1
      fi

      # CycloneDX 1.6: the image this run pushed as the metadata component, one container component
      # per distinct base, and a single dependency edge from the root to all of them. Three appends
      # rather than one unreadable format string; every value goes through `%s`, so nothing in a ref
      # can be read as a printf directive.
      #
      # THE ROOT IS THE DECLARED NAME, unqualified — `artifacts:` above says
      # `{type: docker, name: qits/workspace-base}`, and that is the coordinate a SoftwareRelease
      # consumer asks for. The components keep the refs the build actually resolved, registry host
      # and all, because that is what this image is really made of.
      root="pkg:docker/qits/workspace-base@$version"
      printf '{"bomFormat":"CycloneDX","specVersion":"1.6","version":1,' > sbom.json
      printf '"metadata":{"component":{"type":"container","bom-ref":"%s",' "$root" >> sbom.json
      printf '"name":"qits/workspace-base","version":"%s","purl":"%s"}},' \
        "$version" "$root" >> sbom.json
      printf '"components":[%s],"dependencies":[{"ref":"%s","dependsOn":[%s]}]}\n' \
        "$components" "$root" "$depends" >> sbom.json

      # The store is a sibling path of the npm registry inside the qits-artifacts deployment, so its
      # root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias every step carries, and the
      # one this container can actually dial. NOT $QITS_REGISTRY: that is the host-published name
      # the docker daemon pushes through, and the edge in front of it 401s every sessionless write
      # since the commissioned-credentials cutover (measured twice on 2026.902.53027). ci-base
      # carries the curl, so no helper container is needed for the PUT.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @sbom.json \
        "$sbom_base/docker/qits/workspace-base/-/$version"
