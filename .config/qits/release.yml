archetype: oci
artifacts:
  - { type: docker, name: qits/workspace-base, sbom: sbom.json }

# ONE IMAGE, AND STILL NOT THE ARCHETYPE'S. The build CONTEXT has to be prepared first: the qits CLI
# binary this image ships has to be fetched into the context before buildctl runs — behind a
# client-credentials token minted at the idp, because the artifacts store answers 401 without a
# bearer — and the version has to be passed in as a build arg, because the Dockerfile's
# `ARG QITS_CLI_VERSION` deliberately carries no default. The oci recipe prepares nothing and passes
# no build-arg, so it would push an image with no CLI in it and nothing would say so.
#
# THE VERSION COMES OUT OF pom.xml NOW, not out of the Dockerfile. It used to be scraped from
# `ARG QITS_CLI_VERSION=<version>` — a line nothing on the platform could bump and nothing could keep
# alive in the daemons store, so it rotted on a clock and killed this pipeline with a bare
# `curl: (22) ... 404` twice in three days. It is an ordinary maven property pin now,
# `qits.platform-access-cli-binary.version`, which qits-platform-maintenance bumps and the store's GC
# holds back; pom.xml's own comment carries the full argument. Ticket d0b1965f.
release-request:
  # THE MAVEN STEP RUNS FIRST, AND IT IS HERE TO FAIL LOUDLY RATHER THAN TO BUILD ANYTHING. It
  # resolves `eu.wohlben.qits:qits-platform-access-cli-binary` at the pinned version and does nothing
  # else — there is no source tree in this repository and the jar is never opened. What it buys is
  # the failure mode: a pin naming a version the platform's maven registry no longer holds stops here,
  # in a maven step, with the coordinate and both repository URLs printed, instead of two hours of
  # toolchain later as an unexplained 404 out of a `curl` in the middle of context preparation. It is
  # first for exactly that reason — the cheap check that can only fail for one reason goes before the
  # expensive one that can fail for twenty.
  #
  # It is NOT a substitute for the fetch below, and neither is a substitute for the other: the maven
  # registry and the daemons store are two stores with two retention policies, and the pin has to be
  # alive in both. What the maven half also does is make the pin VISIBLE — a resolvable, released
  # maven coordinate is what qits-platform-maintenance bumps and what the artifacts GC files as a
  # reason to keep the daemon binary.
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # The addresses are code under the platform's public domain (qits-731); `wohlben.eu` covers a
      # qits-ci too old to inject $QITS_DOMAIN. Computed on its own line, before the assignment
      # chain below, deliberately: a `#` line spliced between two backslash-continued `VAR=val \`
      # assignments detaches everything above it into a bare, unexported shell variable that never
      # reaches mvnw's environment — measured with `env -i sh -x`.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      # The commissioned pair where there is one (INTERNAL); otherwise what qits-ci already put in
      # QITS_MAVEN_AUTH_USR/PSW — the run's token subject and token on the EDGE plane (qits-443),
      # which the bare `${QITS_COMMISSIONED_CLIENT_ID-}` used to overwrite with an empty string,
      # a 401 from the public mirror on the first Central artifact.
      QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
      QITS_MAVEN_AUTH_USR="${QITS_COMMISSIONED_CLIENT_ID:-${QITS_MAVEN_AUTH_USR-}}" \
      QITS_MAVEN_AUTH_PSW="${QITS_COMMISSIONED_CLIENT_SECRET:-${QITS_MAVEN_AUTH_PSW-}}" \
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="https://registry.qits.$qits_domain/artifacts/maven/maven"

  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 7200
    script: |
      # THE PIN IS READ WITH `sed`, NOT WITH MAVEN, and that is a fact about this step's image rather
      # than a preference: `qits/build-images/ci-base` carries no maven and no java, and pulling a
      # JDK in to read one line of XML would cost minutes per build. One property element, whole, on
      # one line — which is also the shape qits-platform-maintenance's own bump step insists on when
      # it edits this same line, so a pom that this expression cannot read is a pom the bump cannot
      # write either.
      cli_version=$(sed -nE 's#^[[:space:]]*<qits\.platform-access-cli-binary\.version>(.+)</qits\.platform-access-cli-binary\.version>[[:space:]]*$#\1#p' pom.xml)
      : "${cli_version:?pom.xml declares no <qits.platform-access-cli-binary.version> property; the image pins no qits CLI}"
      # The address is code under the platform's public domain (qits-731); `wohlben.eu` covers a
      # qits-ci too old to inject $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      artifacts_url="https://registry.qits.$qits_domain"
      # THE BEARER IS THE RUN'S OWN TOKEN ON THE EDGE PLANE (qits-443), not a mint: qits-ci sets
      # $QITS_TOKEN there and nothing else, so requiring the commissioned pair unconditionally — as
      # this step used to, with a bare `${QITS_COMMISSIONED_CLIENT_ID:?}` — failed every EDGE run
      # before it ever reached the idp. On the INTERNAL plane $QITS_TOKEN is unset and the
      # commissioned pair mints one, exactly as before.
      if [ -n "${QITS_TOKEN:-}" ]; then
        cli_token="$QITS_TOKEN"
      else
        : "${QITS_COMMISSIONED_CLIENT_ID:?no commissioned client id}"
        : "${QITS_COMMISSIONED_CLIENT_SECRET:?no commissioned client secret}"
        : "${QITS_GIT_AUTH_TOKEN_URL:?no idp token endpoint injected}"
        cli_token=$(curl -fsS --connect-timeout 5 --max-time 30 \
          -u "$QITS_COMMISSIONED_CLIENT_ID:$QITS_COMMISSIONED_CLIENT_SECRET" \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          --data "grant_type=client_credentials&audience=qits-platform" \
          "$QITS_GIT_AUTH_TOKEN_URL" \
          | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        : "${cli_token:?the idp minted no qits-platform bearer for the commissioned client}"
      fi
      # THE FILE IS CALLED `qits` BECAUSE THAT IS WHAT THE DOCKERFILE COPIES AND WHAT THE IMAGE PUTS
      # ON $PATH. The ARTIFACT it comes from is `qits-platform-access-cli`; the two names differ on
      # purpose and neither may be changed here. The VERSION is the third name for one thing: the
      # maven pin above and this daemons-store coordinate are one string, published by one release.
      curl -fsSL --retry 2 --retry-delay 2 -H "Authorization: Bearer $cli_token" \
        -o qits "$artifacts_url/artifacts/daemons/qits-platform-access-cli/$cli_version"
      [ -s qits ] || { echo "the qits CLI download is empty" >&2; exit 1; }
      ref="registry.qits.$qits_domain/$QITS_IMAGE_REPOSITORY/workspace-base:$QITS_CI_SHA"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=. \
        --opt build-arg:QITS_CLI_VERSION="$cli_version" \
        --output "type=image,name=$ref,push=true"

release:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # The addresses are code under the platform's public domain (qits-731); `wohlben.eu` covers a
      # qits-ci too old to inject $QITS_DOMAIN. Computed on its own line, before the assignment
      # chain below — see the release-request slot's maven step for why.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      # The commissioned pair where there is one (INTERNAL); otherwise what qits-ci already put in
      # QITS_MAVEN_AUTH_USR/PSW — the run's token subject and token on the EDGE plane (qits-443),
      # which the bare `${QITS_COMMISSIONED_CLIENT_ID-}` used to overwrite with an empty string,
      # a 401 from the public mirror on the first Central artifact.
      QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
      QITS_MAVEN_AUTH_USR="${QITS_COMMISSIONED_CLIENT_ID:-${QITS_MAVEN_AUTH_USR-}}" \
      QITS_MAVEN_AUTH_PSW="${QITS_COMMISSIONED_CLIENT_SECRET:-${QITS_MAVEN_AUTH_PSW-}}" \
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="https://registry.qits.$qits_domain/artifacts/maven/maven"

  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 7200
    script: |
      cli_version=$(sed -nE 's#^[[:space:]]*<qits\.platform-access-cli-binary\.version>(.+)</qits\.platform-access-cli-binary\.version>[[:space:]]*$#\1#p' pom.xml)
      : "${cli_version:?pom.xml declares no <qits.platform-access-cli-binary.version> property; the image pins no qits CLI}"
      # The address is code under the platform's public domain (qits-731); `wohlben.eu` covers a
      # qits-ci too old to inject $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      artifacts_url="https://registry.qits.$qits_domain"
      # THE BEARER IS THE RUN'S OWN TOKEN ON THE EDGE PLANE (qits-443), not a mint: qits-ci sets
      # $QITS_TOKEN there and nothing else, so requiring the commissioned pair unconditionally — as
      # this step used to, with a bare `${QITS_COMMISSIONED_CLIENT_ID:?}` — failed every EDGE run
      # before it ever reached the idp. On the INTERNAL plane $QITS_TOKEN is unset and the
      # commissioned pair mints one, exactly as before.
      if [ -n "${QITS_TOKEN:-}" ]; then
        cli_token="$QITS_TOKEN"
      else
        : "${QITS_COMMISSIONED_CLIENT_ID:?no commissioned client id}"
        : "${QITS_COMMISSIONED_CLIENT_SECRET:?no commissioned client secret}"
        : "${QITS_GIT_AUTH_TOKEN_URL:?no idp token endpoint injected}"
        cli_token=$(curl -fsS --connect-timeout 5 --max-time 30 \
          -u "$QITS_COMMISSIONED_CLIENT_ID:$QITS_COMMISSIONED_CLIENT_SECRET" \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          --data "grant_type=client_credentials&audience=qits-platform" \
          "$QITS_GIT_AUTH_TOKEN_URL" \
          | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        : "${cli_token:?the idp minted no qits-platform bearer for the commissioned client}"
      fi
      curl -fsSL --retry 2 --retry-delay 2 -H "Authorization: Bearer $cli_token" \
        -o qits "$artifacts_url/artifacts/daemons/qits-platform-access-cli/$cli_version"
      [ -s qits ] || { echo "the qits CLI download is empty" >&2; exit 1; }
      ref="registry.qits.$qits_domain/$QITS_IMAGE_REPOSITORY/workspace-base:$QITS_VERSION"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=. \
        --opt build-arg:QITS_CLI_VERSION="$cli_version" \
        --output "type=image,name=$ref,push=true"
      # THE SBOM GENERATOR DOES NOT NEED THE BUILD ARG TODAY, AND IS GIVEN IT ANYWAY. `qits-publish
      # sbom from-dockerfile` describes `FROM` lines: DockerfileSbom collects ARG defaults only to
      # resolve a `${...}` inside one, and the single `FROM debian:bookworm-slim` at the head of this
      # file reads no ARG at all. What makes the flag worth one word is the parser's treatment of an
      # ARG with NO default — it records the empty string, and `expand` prefers a recorded empty
      # string over an error — so the day a `FROM` here reads `${QITS_CLI_VERSION}`, an unpassed arg
      # would resolve silently to nothing and publish a document naming a base image that does not
      # exist. Passing it costs nothing and closes that quietly.
      qits-publish sbom from-dockerfile \
        --root-name qits/workspace-base --root-version "$QITS_VERSION" \
        --dockerfile Dockerfile \
        --build-arg QITS_CLI_VERSION="$cli_version" \
        -o sbom.json
