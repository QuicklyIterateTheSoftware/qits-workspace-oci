# THE ONE QA PIPELINE THIS REPOSITORY HAS, and it runs for a release request and nothing else.
#
# There is no push pipeline any more, and `ci-post-receive.yml` is what this file replaces.
# qits-projects keeps a backing branch `release/<id>` per open release request — an octopus merge of
# that request's sources, refolded whenever the set changes — and publishes `ReleaseRequestChanged`
# on every successful re-fold. The merge primitive that writes that branch fires no `post-receive`
# and so publishes no `SCMPublishCommit`: without this file the fold exists and NOTHING BUILDS IT.
# A fold the git host answered `unchanged`, and one that conflicted, publish nothing — so every
# arrival here is a new sha worth a build.
#
# DECIDED AT MAIN, BUILT AT THE FOLD. This file is discovered, parsed and selected at `main`'s head,
# always; only the run's branch and sha come from the payload, which is why `checkout:` names them
# as a pair — a sha with no branch whose history holds it is not something a step container can
# fetch. A release request therefore cannot alter the CI that gates it by folding in a commit that
# edits this file. Inside a step, $QITS_CI_BRANCH is `release/<id>` and $QITS_CI_SHA is the merged
# sha; the fold is already checked out, so nothing below fetches or switches refs.
#
# EVERY STEP HERE IS GATING, INCLUDING THE ONE THAT PUSHES AN IMAGE. It stays in the gating half on
# purpose: whatever a run publishes is published before anything later can fail. The coordinate it
# pushes is the MERGED SHA, which no `ReleaseRequestChanged` is ever derived from, so this pipeline
# cannot re-trigger itself; and a redelivered event re-pushes identical content under the same tag,
# which is why nothing here treats an existing tag as an error. The verdict returns on the ordinary
# `BuildSuccessful`/`BuildFailed` with `commitSha` = the merged sha, which is what qits-projects'
# `BuildStatusListener` matches on together with `repoId`.
#
# ci-event-release.yml BESIDE THIS FILE IS UNTOUCHED and is still the other half: it reacts to this
# repository's release TAG and publishes the released coordinate. This file names a build by the
# merged sha; that one names a release by its version. Neither pushes the other's coordinate.
#
# THE IMAGE NAME IS NOT THE REPOSITORY NAME. This publishes `qits/workspace-base`, because that is
# the name every consuming Dockerfile already writes — qits-workspace-daemon's
# docker/Dockerfile.workspace and the project-agent images take it as their base. Renaming it to
# match the repository would break them for nothing. The repository name is where the recipe lives;
# `qits/workspace-base` is what the recipe produces.
#
# ONE TAG PER PIPELINE, AND THE REASON CHANGED WHILE THE RULE DID NOT. It used to be a hazard: a
# sibling tried `docker build -t A -t B` and pushed both, and the second push failed with "tag does
# not exist", because BuildKit's exporter does not reliably leave every alias of a multi-tag build
# in the LOCAL image store. There is no local store in this path any more — `push=true` sends the
# image from the builder to the registry directly — so the hazard is gone and the rule stays on its
# own merit: one build, one declared name. A second coordinate would be a second declaration, and
# under buildctl it would also be a second `--output` invocation (a full cache hit, but still a
# second thing to keep true). Split the coordinates instead — this pipeline owns the sha,
# ci-event-release.yml owns the version.
#
# THE BUILD RUNS ON THE PLATFORM'S OWN BUILDKITD, NOT THE HOST DAEMON — qits-buildkit-plan.md in the
# wrapper is the whole migration and qits-workspace-daemon's pipeline pair is the reference recipe.
# `build: true` is the declaration: qits-ci hands such a step $QITS_BUILD_REGISTRY (the registry as
# the BUILDER resolves it) and qits-containers hands it $BUILDKIT_HOST, and the host docker socket
# this step used to hold is not mounted at all any more.
#
# STILL NO `--network` FLAG AND NOTHING REPLACES ONE. This build dials nothing on the PLATFORM; what
# it does dial is the open internet — Debian's apt mirrors, npm, download.eclipse.org, the Playwright
# download host — and it now dials all of it from buildkitd's namespace on qits-net rather than from
# this step container's bridge.
#
# ONE THING TO KNOW BEFORE DEBUGGING A COLD BUILD HERE: Dockerfile's `FROM debian:bookworm-slim` is
# a BARE Docker Hub name, and it is the one committed `FROM` in this repository. The builder's
# registry config rewrites the platform's own edge vhosts (registry.dev.localhost:8080,
# mirror.dev.localhost:8080) and deliberately maps no `docker.io`, so this reference resolves Docker
# Hub DIRECTLY from the builder rather than through qits-platform-mirror's `hub` namespace — where
# the host daemon's `registry-mirrors` used to send it. That is a change in behaviour this commit
# does not paper over: fixing it means spelling the mirror in the Dockerfile (a `FROM` change, and
# one qits-maintenance's pin inventory has to agree with) or adding a `docker.io` stanza to
# buildkitd.toml, and both are somebody's decision rather than this recipe's.
#
# `set -eu` is load-bearing rather than tidy: the daemon runs the script with `bash -c` and no -e,
# so without it a failed buildctl call is swallowed by the next command's exit code and the run
# reports SUCCESS. The deployer is then told an image exists that does not. -u makes an unset
# injected variable stop the step rather than composing a ref out of empty strings.
#
# The timeout is large on purpose. This is a ~3.4 GB image: two apt trees, a JDK, node + pnpm, a
# Playwright Chromium with its shared-library deps, two agent CLIs and jdtls, all fetched from the
# network. An hour is not enough headroom on a cold cache.

event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since
  # the identity cutover, so a name match on repoId is not dependable. The event
  # echoes the public name; a rename updates this line in the same campaign.
  - repoName: { exact: qits-workspace-oci }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 7200
    script: |
      set -eu
      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false
      # spells off as empty-never-absent). Either way this recipe must fail here, naming the cause —
      # there is no socket left to fall back to, and a ref composed from an empty registry would
      # push into nowhere.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"
      # --- the pinned qits CLI, fetched HERE into the build context --------------------------------
      # THE DOCKERFILE CANNOT FETCH THIS FILE AND THIS STEP CAN — that is the whole reason the
      # download lives in a CI recipe instead of a `curl` layer beside Claude Code and jdtls. Those
      # layers dial the OPEN INTERNET, which buildkitd reaches; the qits CLI lives in the PLATFORM's
      # artifacts store, and this recipe pair is explicit about that (ci-event-release-request.yml's
      # header, "This build dials nothing on the PLATFORM"): the build runs in buildkitd's namespace
      # with no commissioned credential and no platform address of any kind in the recipe. Doing it
      # there would mean passing the store's URL in as a build arg and the credential in as a secret
      # mount, and a hermetic build would stop being one — a large change for one 42 MB file.
      #
      # AND THE STORE IS GATED, MOSTLY. Measured 2026-09-14 against dev-qits-artifacts:8080:
      # `GET /artifacts/api/repositories/daemons/daemons` answers 401 with no token, 200 with a
      # `qits-platform` bearer, and 401 for HTTP basic with the commissioned pair. The one download
      # URL below is the exception — it answered 200 with no token at all on the same day — and the
      # bearer goes with it anyway, deliberately: a fetch that works only while one door happens to
      # stand open is a build that breaks the day somebody closes it, and the neighbouring door is
      # already closed. It costs one token mint, in a container that holds the credential regardless.
      #
      # THIS CONTAINER HAS EVERYTHING THE BUILDER LACKS: CiDaemonLauncher injects
      # QITS_COMMISSIONED_CLIENT_ID, QITS_COMMISSIONED_CLIENT_SECRET, QITS_GIT_AUTH_TOKEN_URL and
      # QITS_ARTIFACTS_URL into every step container. So the fetch happens here, into the working
      # directory, and `buildctl build --local context=.` sends the file up with the rest of the
      # context — where the Dockerfile's `COPY qits /usr/local/bin/qits` picks it up.
      #
      # THE VERSION IS THE DOCKERFILE'S, SCRAPED, NEVER RESTATED. The pin is committed as one
      # `ARG QITS_CLI_VERSION=` line and read back out of it, so this recipe and the image can not
      # disagree about which CLI the image ships; the same shape qits-ci-daemon's recipe uses to read
      # its musl toolchain URLs out of a Dockerfile ARG. Bumping the CLI is an edit to that one line.
      #
      # THIS BLOCK IS BYTE-IDENTICAL IN ci-event-release-request.yml AND ci-event-release.yml, for the
      # same reason their buildctl lines are: the builder's cache is shared, and a context that
      # differs between the two would turn the release build that follows a green fold from a stack of
      # cache hits into a second assembly of the whole toolchain.
      #
      # EVERY MISSING INPUT FAILS LOUDLY AND BY NAME. `set -u` alone would stop the step, but on a
      # `curl: (3) URL rejected` twenty lines from the cause; and the token pipeline below cannot rely
      # on -e at all, because a failing curl feeding a succeeding sed is a pipeline that exits 0 with
      # an empty token. The `:?` guards are what turn each of those into one sentence naming the
      # input.
      cli_version=$(sed -nE 's#^ARG QITS_CLI_VERSION=(.+)$#\1#p' Dockerfile)
      : "${cli_version:?Dockerfile declares no ARG QITS_CLI_VERSION; the image pins no qits CLI}"
      : "${QITS_ARTIFACTS_URL:?the artifacts store address is not injected; the pinned qits CLI cannot be fetched}"
      : "${QITS_COMMISSIONED_CLIENT_ID:?no commissioned client id; the artifacts store answers 401 without a bearer}"
      : "${QITS_COMMISSIONED_CLIENT_SECRET:?no commissioned client secret; the artifacts store answers 401 without a bearer}"
      : "${QITS_GIT_AUTH_TOKEN_URL:?no idp token endpoint injected; the qits-platform bearer cannot be minted}"
      # `qits-platform` is the audience the artifacts store accepts, and jq is deliberately not used:
      # this is the one extraction in this file that must keep working in a step image that carries
      # only curl and sed, so it reads the field the way the composed release prelude does.
      cli_token=$(curl -fsS --connect-timeout 5 --max-time 30 \
        -u "$QITS_COMMISSIONED_CLIENT_ID:$QITS_COMMISSIONED_CLIENT_SECRET" \
        -H 'Content-Type: application/x-www-form-urlencoded' \
        --data "grant_type=client_credentials&audience=qits-platform" \
        "$QITS_GIT_AUTH_TOKEN_URL" \
        | sed -n 's/.*"access_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
      : "${cli_token:?the idp minted no qits-platform bearer for the commissioned client}"
      curl -fsSL --retry 2 --retry-delay 2 -H "Authorization: Bearer $cli_token" \
        -o qits "$QITS_ARTIFACTS_URL/artifacts/daemons/qits-platform-access-cli/$cli_version"
      # -f already refuses a 4xx/5xx, so what is left to catch is the honest-looking nothing: a 200
      # with an empty body leaves a zero-byte file that COPYs perfectly and produces an image whose
      # `qits` cannot run. The Dockerfile runs `qits --help` for the same reason from the other side;
      # this one keeps the failure in the half of the run that names the download.
      [ -s qits ] || { echo "the qits CLI download is empty: $QITS_ARTIFACTS_URL/artifacts/daemons/qits-platform-access-cli/$cli_version" >&2; exit 1; }
      echo "qits-workspace-oci: fetched qits-platform-access-cli $cli_version into the build context" >&2

      # `push=true` IS THE PUBLISH: the image goes from the builder straight to the registry and
      # never enters any local image store. That retires the old rmi note wholesale — it described a
      # containerd store this pipeline no longer touches. The concurrent builds it worried about are
      # real and unchanged (a re-fold landing while the previous one is still building, or this file
      # and ci-event-release.yml overlapping), but they now share the builder's cache, which is
      # content-addressed and refcounted, so there is no last reference for anything to drop.
      #
      # $QITS_BUILD_REGISTRY, not $QITS_REGISTRY: the same registry from the builder's side of the
      # network. $QITS_REGISTRY stays the host daemon's view and is not dialled here.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/workspace-base:$QITS_CI_SHA"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=. \
        --output "type=image,name=$ref,push=true"
